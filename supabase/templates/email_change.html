<!-- Supabase Dashboard > Authentication > Email Templates > "Change Email Address" · Assunto: Confirme seu novo e-mail -->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#09090b;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#e6e9f0">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#121214;border:1px solid #26262b;border-radius:14px">
          <tr><td style="padding:20px 28px;border-bottom:1px solid #26262b;font-size:20px;font-weight:800;color:#fff">GhostKeys<span style="color:#8804fa">.</span></td></tr>
          <tr><td style="padding:28px">
            <h1 style="margin:0 0 16px;font-size:22px;color:#fff">Confirme seu novo e-mail</h1>
            <p style="font-size:15px;line-height:1.6;color:#c9cfdc">Recebemos um pedido para trocar o e-mail da sua conta de <b>{{ .Email }}</b> para <b>{{ .NewEmail }}</b>. Confirme para concluir a troca.</p>
            <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/conta" style="display:inline-block;background:#6d00d4;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px">Confirmar novo e-mail</a></p>
            <p style="font-size:12px;color:#8a93a8">Se você não pediu esta troca, ignore este e-mail e considere alterar sua senha.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
