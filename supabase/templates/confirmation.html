<!-- Supabase Dashboard > Authentication > Email Templates > "Confirm signup"
     Assunto sugerido: Confirme seu cadastro -->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#09090b;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#e6e9f0">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#121214;border:1px solid #26262b;border-radius:14px">
          <tr><td style="padding:20px 28px;border-bottom:1px solid #26262b;font-size:20px;font-weight:800;color:#fff"><a href="{{ .SiteURL }}" style="text-decoration:none;color:#fff"><img src="{{ .SiteURL }}/email/logo.png" width="200" height="31" alt="GhostKeys" style="display:block;border:0;outline:none;width:200px;height:auto;color:#fff;font-size:20px;font-weight:800"></a></td></tr>
          <tr><td style="padding:28px">
            <h1 style="margin:0 0 16px;font-size:22px;color:#fff">Bem-vindo(a)! Confirme seu e-mail</h1>
            <p style="font-size:15px;line-height:1.6;color:#c9cfdc">Falta pouco: confirme seu endereço de e-mail para ativar sua conta e acessar seus pedidos e keys.</p>
            <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/conta" style="display:inline-block;background:#6d00d4;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px">Confirmar e-mail</a></p>
            <p style="font-size:12px;color:#8a93a8">Se você não criou esta conta, ignore este e-mail.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
